name: 🚀 Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      # Maintains a rolling release PR (version bump + changelog) and, on its
      # merge, tags vX.Y.Z and cuts the GitHub Release
      - uses: googleapis/release-please-action@v5.0.0
        id: release
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      # release-please has no native assignee option — assign the owner via a
      # follow-up step
      - if: ${{ steps.release.outputs.prs_created == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run:
          gh pr edit ${{ fromJSON(steps.release.outputs.pr).number }}
          --add-assignee jjloneman --repo ${{ github.repository }}
